alerts:
- rule: DEPLOYMENT_FAILED
- rule: DOMAIN_FAILED
domains:
- domain: appsto.software
  type: PRIMARY
features:
- buildpack-stack=ubuntu-22
ingress:
  rules:
  - component:
      name: appsto
    match:
      path:
        prefix: /
name: appsto
region: blr
services:
- environment_slug: node-js
  github:
    branch: master
    deploy_on_push: true
    repo: M-UmarJaved/appsto
  http_port: 8080
  instance_count: 1
  instance_size_slug: apps-s-1vcpu-1gb
  name: appsto
  run_command: npm start
  source_dir: /
